  <path d="M224 346 L226 376" fill="none" stroke-width="8"/>
  <path d="M300 346 L298 376" fill="none" stroke-width="8"/>
  <circle cx="226" cy="380" r="8" fill="#FFD100" stroke-width="4"/>
  <circle cx="298" cy="380" r="8" fill="#FFD100" stroke-width="4"/>
  <!-- arms -->
  <ellipse cx="196" cy="394" rx="19" ry="42" transform="rotate(16 196 394)" fill="#fff"/>
