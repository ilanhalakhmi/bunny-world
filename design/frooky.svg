  <path d="M190 192 C150 140 138 60 152 30 C160 12 185 14 200 40 C220 80 232 130 236 172 Z" fill="#fff"/>
  <path d="M190 165 C172 130 166 85 176 68 C190 72 205 120 212 160 Z" fill="#FFD100" stroke-width="3.5"/>
