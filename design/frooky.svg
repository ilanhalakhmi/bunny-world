  <path d="M352 472 V452 Q352 441 364 441 Q376 441 376 452 V472" fill="none" stroke-width="7"/>
  <rect x="332" y="470" width="86" height="58" rx="9" fill="#F37021"/>
  <path d="M332 490 H418" fill="none" stroke-width="4"/>
  <rect x="346" y="484" width="12" height="12" rx="2" fill="#FFD100" stroke-width="3.5"/>
  <rect x="392" y="484" width="12" height="12" rx="2" fill="#FFD100" stroke-width="3.5"/>
  <!-- sticker 1: magnifying glass -->
  <circle cx="357" cy="512" r="13" fill="#fff" stroke-width="3"/>
  <circle cx="354" cy="509" r="5.5" fill="#fff" stroke="#005CA9" stroke-width="2.8"/>
  <path d="M358.5 513.5 L364 519" fill="none" stroke="#005CA9" stroke-width="3.5"/>
  <!-- sticker 2: pencil -->
  <circle cx="393" cy="512" r="13" fill="#fff" stroke-width="3"/>
  <g transform="translate(393 512) rotate(45)" stroke-width="1.8">
    <rect x="-3" y="-11" width="6" height="3.5" fill="#F37021"/>
    <rect x="-3" y="-7.5" width="6" height="12" fill="#FFD100"/>
    <path d="M-3 4.5 L0 10 L3 4.5 Z" fill="#fff"/>
  </g>
  <!-- hand gripping the handle -->
  <circle cx="356" cy="456" r="11" fill="#fff"/>
