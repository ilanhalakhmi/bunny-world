  <circle cx="206" cy="268" r="7" fill="#000" stroke="none"/>
  <circle cx="312" cy="266" r="7" fill="#000" stroke="none"/>
  <ellipse cx="190" cy="293" rx="14" ry="8" fill="#F37021" stroke="none" opacity=".7"/>
  <ellipse cx="328" cy="290" rx="14" ry="8" fill="#F37021" stroke="none" opacity=".7"/>
  <path d="M260 291.2 C249.4 284.6 250.8 276 256 276 C258.7 276 260 278 260 280 C260 278 261.3 276 264 276 C269.2 276 270.6 284.6 260 291.2 Z" fill="#F37021" stroke-width="2.8"/>
  <path d="M260 292 V299 M245 299 Q252 311 260 299 Q268 311 275 299" fill="none" stroke-width="4.5"/>
